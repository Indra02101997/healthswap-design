[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "healthswap-client"
version = "0.1.0"
description = "Server-side Python client for the HealthSwap Partner API: OAuth client credentials, fail-open cart evaluation, retries, webhook verification"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
healthswap_client = ["py.typed"]
