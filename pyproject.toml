[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "healthswap"
version = "0.1.0"
description = "HealthSwap reference implementation: healthier-swap API with the RA-1 recommended-add fee and the FP-1 fair-premium fee"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "PyYAML>=6.0",
  "jsonschema>=4.23",
  "PyJWT[crypto]>=2.9",
  "cryptography>=43",
  "httpx>=0.27",
  "numpy>=1.26",
  "onnxruntime>=1.19",
  "mcp>=2.3,<3",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
redis = ["redis>=5"]
ml = ["scikit-learn>=1.5", "skl2onnx>=1.17", "onnx>=1.16"]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.6"]

[project.scripts]
hs = "healthswap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: starts the PGlite dev database (needs Node.js 20+ and `npm ci` in tools/devdb)"]

[tool.ruff]
line-length = 160
target-version = "py311"
extend-exclude = ["archive"]

[tool.ruff.lint]
select = ["F", "E9", "B006", "B008"]
